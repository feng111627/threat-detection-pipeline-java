# 随机端口，避免本地演示/测试占用固定端口
server.port=0

# ========== 威胁检测链路本地配置 ==========
# 默认规则资源（classpath），调整规则可替换为 rules-v2.json 或自定义文件
threat.rules-resource=rules-default.json
# 允许的事件类型白名单（业务校验 V003 使用）
threat.allowed-event-types=LOGIN_SUCCESS,LOGIN_FAIL,PRIVILEGE_ESCALATION,MALWARE_DETECTED,FIREWALL_BLOCK,SQLI_ATTEMPT,DATA_EXPORT,PROCESS_SPAWN
# 时间戳允许超出当前时间的偏移（秒），超过判 V005
threat.max-future-skew-seconds=60
# 时间戳允许的最大历史跨度（天），早于该值判 V006
threat.max-age-days=3650
